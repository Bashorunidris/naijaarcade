m.innerHTML=`<div class="bal"><div class="eyebrow">WALLET BALANCE</div><div class="amt">${NG(WL.balance)}</div>${WL.locked?`<p>${NG(WL.locked)} is held in your current match</p>`:''}</div>
<button class="gold" onclick="location.href='naija-arcade.html#wallet'">DEPOSIT · WITHDRAW · LIMITS</button>
<div class="hs"><div><b>${lv}</b>LEVEL</div><div><b>${n(PR.xp)}</b>XP</div><div><b>${PR.w||0}</b>WINS</div></div>
<p class="fine">18+ only. Gamble responsibly: set a budget, never chase losses, take breaks.</p>`}
const CLUBS=[['Red Royals','#d81f26','#ffffff','RRY'],['Sky Citizens','#6cc4ff','#ffffff','SKC'],['Blue Lions','#0b3ea8','#ffd23f','BLN'],['Gold Wolves','#f5c400','#111111','GWF'],['Green Gaels','#0a8f4a','#ffffff','GGL'],['Night Magpies','#f2f2f2','#111111','NMP']];
function rivalCfg(){const k=CLUBS[Math.random()*6|0];return clean({name:['STRIKER','BLAZE','ACE','VIPER','TUNDE','CHIDI'][Math.random()*6|0],num:1+Math.random()*98,c1:k[1],c2:k[2],sty:Math.random()*4,tag:k[3],skin:Math.random()*5,hair:Math.random()*4})}

function pv(){const e=$('#pvc');if(!e)return;const c1=CFG.c1,c2=CFG.c2,st=CFG.sty;
  const pat=st===1?[...Array(7)].map((_,i)=>`<rect x="${i*30}" width="14" height="240" fill="${c2}"/>`).join(''):st===2?[...Array(8)].map((_,i)=>`<rect y="${i*30}" width="200" height="14" fill="${c2}"/>`).join(''):st===3?`<polygon points="0,0 70,0 200,240 130,240" fill="${c2}"/>`:'';
  e.innerHTML=`<svg viewBox="0 0 200 240"><defs><clipPath id="jc"><path d="M62 18l-44 24 16 44 24-9v118h88V77l24 9 16-44-44-24q-10 18-44 18T62 18z"/></clipPath></defs><g clip-path="url(#jc)"><rect width="200" height="240" fill="${c1}"/>${pat}<rect y="0" width="200" height="30" fill="rgba(0,0,0,.18)"/></g><path d="M62 18l-44 24 16 44 24-9v118h88V77l24 9 16-44-44-24q-10 18-44 18T62 18z" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/></svg><div class="num">${CFG.num}</div>`}
function upd(){CFG=clean({...CFG,name:$('#nm').value||'YOU',num:$('#nu').value,c1:$('#c1').value,c2:$('#c2').value,ball:$('#bl').value});pv()}
function tabPlayer(m){m.innerHTML=`<div class="cz"><div id="pvc" class="jv"></div><div class="ct"><div class="sub">CHANGE TEAM</div><div class="chips" id="clubs"></div>
<div class="row"><input type="text" id="nm" maxlength="12" placeholder="Name" value="${CFG.name}"><input type="number" id="nu" min="1" max="99" value="${CFG.num}" style="max-width:64px"></div>
<div class="row"><label class="c">Kit<input type="color" id="c1" value="${CFG.c1}"></label><label class="c">Trim<input type="color" id="c2" value="${CFG.c2}"></label><label class="c">Ball<input type="color" id="bl" value="${CFG.ball}"></label></div>
<div class="row" id="sks"></div><div class="row"><button class="gh" id="hr">Hair: ${HR[CFG.hair]}</button><button class="gh" id="sty">Kit: ${STY[CFG.sty]}</button></div></div></div>`;
CLUBS.forEach(k=>{const b=document.createElement('button');b.className='chip';b.style.background=`linear-gradient(135deg,${k[1]} 50%,${k[2]} 50%)`;b.textContent=k[0];b.onclick=()=>{CFG.tag=k[3];CFG.c1=k[1];CFG.c2=k[2];$('#c1').value=k[1];$('#c2').value=k[2];sfx('click');pv()};$('#clubs').appendChild(b)});
SK.forEach((c,i)=>{const b=document.createElement('button');b.className='sk'+(CFG.skin==i?' on2':'');b.style.background=c;b.onclick=()=>{CFG.skin=i;sfx('click');tab('me')};$('#sks').appendChild(b)});
['nm','nu','c1','c2','bl'].forEach(i=>$('#'+i).oninput=upd);
$('#hr').onclick=()=>{CFG.hair=(CFG.hair+1)%4;$('#hr').textContent='Hair: '+HR[CFG.hair];pv()};
$('#sty').onclick=()=>{CFG.sty=(CFG.sty+1)%4;$('#sty').textContent='Kit: '+STY[CFG.sty];pv()};pv()}
function tabAch(m){const n=Object.keys(PR.ach).length;m.innerHTML=`<p>${n} / ${ACH.length} unlocked · each gives +100 🪙</p><div class="ach">${ACH.map((a,i)=>`<div class="a ${PR.ach[i]?'u':''}"><i>${a[0]}</i><div><b>${a[1]}</b><span>${a[2]}</span></div></div>`).join('')}</div>`}
function tabSet(m){m.innerHTML=`<div class="sub">SOUND EFFECTS</div><div class="row"><button class="${ST.snd?'alt':'gh'}" onclick="ST.snd^=1;save();sfx('click');tab('me')">${ST.snd?'🔊 ON':'🔇 OFF'}</button></div>
<div class="sub">AFROBEAT MUSIC</div><div class="row"><button class="${ST.mus?'alt':'gh'}" onclick="ST.mus^=1;save();ST.mus?musicOn():musicOff();tab('me')">${ST.mus?'🎵 ON':'🎵 OFF'}</button></div>
<div class="sub">VOLUME</div><div class="row"><input type="range" min="0" max="1" step=".1" value="${ST.vol}" oninput="ST.vol=ST.mv=+this.value;if(MG)MG.gain.value=ST.mv*.6" onchange="save();sfx('goal')"></div>
<div class="sub">PRACTICE DIFFICULTY (DEMO ONLY)</div><div class="row">${[0,1,2].map(i=>`<button class="${ST.diff==i?'':'gh'}" onclick="ST.diff=${i};save();tab('me')">${DF[i]}</button>`).join('')}</div>`}
let PS='player';
const IC={play:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/></svg>',tour:'<svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8M10 17h4"/></svg>',rank:'<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',wal:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 10h14a2 2 0 0 0 2-2"/></svg>',me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>'};
const NAV=[['play','PLAY'],['tour','TOURNEYS'],['rank','RANKS'],['wal','WALLET'],['me','PROFILE']];
function navDraw(){const n=$('#nav');n.innerHTML=NAV.map(a=>`<button class="${TAB===a[0]?'on':''}" onclick="sfx('click');tab('${a[0]}')">${IC[a[0]]}${a[1]}</button>`).join('')}
new MutationObserver(()=>{$('#nav').classList.toggle('hide',!$('#mbody'))}).observe($('#mcard'),{childList:true});
function tabMe(m){const secs=[['player','Player'],['ach','Trophies'],['hist','History'],['set','Settings']];
  m.innerHTML=`<div class="seg">${secs.map(x=>`<button class="${PS===x[0]?'on':''}" onclick="sfx('click');PS='${x[0]}';tab('me')">${x[1]}</button>`).join('')}</div><div id="pbody"></div>`;
  const b=$('#pbody');if(PS==='player')tabPlayer(b);else if(PS==='ach')tabAch(b);else if(PS==='hist')tabHist(b);else tabSet(b)}
function tab(t){TAB=t;const m=$('#mbody');if(!m)return;navDraw();
if(t==='play'){m.innerHTML=`<div class="hero"><div class="eyebrow">LIVE · 1v1 PENALTY SHOOTOUT</div><h1>Beat a real player.<br><span>Win real money.</span></h1></div>
<div class="sub">CHOOSE YOUR STAKE</div><div class="stk" id="stk"></div>
<button id="goBtn">FIND MATCH</button><button class="gh" onclick="newGame('cpu',0)">PRACTICE FREE VS COMPUTER</button>
<p class="fine">You are matched with one real player at the same stake. The winner collects both stakes minus a 15% fee on winnings. You can lose your stake. 18+ only. Gamble responsibly.</p>`;renderStk()}
else if(t==='tour'){if(!['tour','new','det'].includes(BT))BT='tour';tabBoard(m)}
else if(t==='rank'){if(!['day','week','month'].includes(BT))BT='day';tabBoard(m)}
else if(t==='wal')tabWal(m);else tabMe(m)}
function home(t){S=null;P={};QTID=null;save();$('#hud').classList.add('hide');$('#ff').classList.add('hide');$('#menu').classList.remove('hide');$('#tag').textContent='';$('#pot').textContent='';
$('#mcard').innerHTML='<div id="mbody"></div>';tab(t||TAB);renderBar()}
if(au)au.onAuthStateChanged(u=>{if(unW){unW();unW=null}if(unP){unP();unP=null}
if(!u){ME=null;WL={balance:0,locked:0};unsubLB();renderStk();renderBar();if(OPENT){location.replace('naija-arcade.html?next=naija-kick.html&t='+OPENT);return}return}
ME=u;subLB();
unP=db.doc('players/'+u.uid).onSnapshot(sn=>{const d=sn.exists?sn.data():{};
if(!kLoaded){kLoaded=true;if(d.kick){const k=d.kick;PR.xp=k.xp||0;PR.coins=k.coins||0;PR.streak=k.streak||0;PR.w=k.w||0;PR.g=k.g||0;PR.sv=k.sv||0;PR.ach=k.ach||{};PR.hist=k.hist||PR.hist||[];if(k.cfg)CFG=clean(k.cfg)}else syncK()}
renderBar();if(!S&&!$('#menu').classList.contains('hide')&&(TAB==='wal'||(TAB==='me'&&PS==='hist')))tab(TAB)},()=>{});
unW=db.doc('wallets/'+u.uid).onSnapshot(sn=>{WL=Object.assign({balance:0,locked:0},sn.exists?sn.data():{});renderStk();renderBar();if(!S&&TAB==='wal')tab('wal');resumeHold()},e=>permErr(e));
if(OPENT&&!tOpened){tOpened=true;setTimeout(()=>{if(!S&&!holdBusy)openT(OPENT)},600)}});
addEventListener('error',()=>toast('Something went wrong. Reload if the game freezes.'));
home('play');
</script></body></html>
