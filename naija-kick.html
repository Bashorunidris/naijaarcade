/* ---------- pitch ---------- */

   Each player claims their own refund when they open the game. Firestore rules (see firestore.rules.additions.txt)
   only allow it when the tournament was cancelled, or ended with no matches set. The full fee (incl. the 15%) comes back. */
async function markFx(){try{if(!TV||!TD||TD.creator!==ME.uid||TD.hasFx)return;const s=await db.collection('tFix').where('tid','==',TV).limit(1).get();if(!s.empty)await db.doc('tournaments/'+TV).update({hasFx:true})}catch(e){}}
const _autoSet=autoSet;autoSet=async function(){await _autoSet.apply(this,arguments);markFx()};
const _addFx=addFx;addFx=async function(){await _addFx.apply(this,arguments);markFx()};
let RFB=false;
async function claimRefunds(){if(RFB||!ME||!db||hasS())return;RFB=true;
  try{const es=await db.collection('tEntries').where('uid','==',ME.uid).limit(60).get();
    for(const e of es.docs){const d=e.data();if(d.refunded)continue;const ts=await db.doc('tournaments/'+d.tid).get();if(!ts.exists)continue;const t=ts.data();
      if(!(t.status==='closed'||(Date.now()>t.end&&!t.hasFx&&!t.settled)))continue;
      await db.runTransaction(async tx=>{const er=await tx.get(e.ref);if(!er.exists||er.data().refunded)return;const wref=db.doc('wallets/'+ME.uid),w=(await tx.get(wref)).data()||{};
        tx.set(wref,{balance:(w.balance||0)+d.fee,rfTid:d.tid},{merge:true});
        tx.update(e.ref,{refunded:true,refundedAt:FV().serverTimestamp(),refundWhy:t.status==='closed'?'cancelled':'organizer_no_matches'})});
      toast('Refunded '+NG(d.fee)+' from "'+(t.name||'tournament')+'"')}}
  catch(e){console.error(e)}RFB=false}
setInterval(()=>{if(ME)claimRefunds()},60000);setTimeout(()=>{if(ME)claimRefunds()},5000);

/* handlers used by inline onclick */
window.PLUS={arenas:ARENAS,
  pick(kind,id){const def=(kind==='boots'?BOOTS:CELE)[id],k=kind+'_'+id;if(!COS.owned[k]){if((PR.coins||0)<def.p){toast('Not enough coins. You need 🪙 '+def.p);return}
      ask('Buy '+def.n+' for 🪙 '+def.p+'?',()=>{PR.coins-=def.p;COS.owned[k]=1;COS[kind]=id;save();saveCos();toast(def.n+' equipped');tab('me')},'YES, BUY');return}
    COS[kind]=id;saveCos();sfx('click');tab('me')},
  arena(v){COS.arena=v;saveCos();menuArena();sfx('click')},
  seasons(){sfx('click');SV='list';SVID=null;tab('tour')},back(){sfx('click');SV=null;tab('tour')},snew(){sfx('click');SV='new';tab('tour')},
  sopen(id){sfx('click');SV='det';SVID=id;tab('tour')},screate:createSeason,
  saccept(id){db.doc('seasons/'+id).update({partnerOk:true,status:'active'}).then(()=>toast('Partnership accepted')).catch(permErr)},
  sdecline(id){db.doc('seasons/'+id).update({status:'declined'}).then(()=>{toast('Declined');SV='list';tab('tour')}).catch(permErr)},
  tin(id){PRES=id;SV=null;BT='new';tab('tour')},tgo(id){SV=null;openT(id)}};
})();
</script></body></html>
